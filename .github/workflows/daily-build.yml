name: Build Node D

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node D
        run: |
          mkdir -p raw_data public
          curl -L --fail "https://i.mjh.nz/PlutoTV/au.xml.gz" | gunzip > raw_data/pluto_au.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_AU1.xml.gz" | gunzip > raw_data/share_au.xml
          curl -L --fail "https://epg.pw/xmltv/epg_NZ.xml.gz" | gunzip > raw_data/pw_nz.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_IN1.xml.gz" | gunzip > raw_data/share_in.xml
          curl -L --fail "https://epg.pw/xmltv/epg_IN.xml.gz" | gunzip > raw_data/pw_in.xml
          python scripts/build_db.py public/d.sqlite3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - uses: actions/deploy-pages@v4
