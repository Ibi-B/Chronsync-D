name: Build Node D

on:
  push:
    branches:
      - codex/fix-pipeline-validation-2026-11-10
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node D
        run: |
          set -euo pipefail
          mkdir -p raw_data public
          fetch_xmltv() {
            local url="$1"
            local output="$2"
            local compressed="${output}.gz"
            if curl --location --fail --silent --show-error --retry 2 --retry-all-errors "$url" --output "$compressed" &&
               gzip -t "$compressed" &&
               gzip -dc "$compressed" > "$output" &&
               test -s "$output"; then
              rm -f "$compressed"
              echo "::notice::Fetched valid XMLTV feed: $url"
            else
              rm -f "$compressed" "$output"
              echo "::warning::Skipping unavailable or invalid optional feed: $url"
            fi
          }

          fetch_xmltv "https://i.mjh.nz/PlutoTV/au.xml.gz" raw_data/pluto_au.xml
          fetch_xmltv "https://epg.pw/xmltv/epg_NZ.xml.gz" raw_data/pw_nz.xml
          fetch_xmltv "https://epgshare01.online/epgshare01/epg_ripper_IN1.xml.gz" raw_data/share_in.xml
          fetch_xmltv "https://epg.pw/xmltv/epg_IN.xml.gz" raw_data/pw_in.xml

          valid_feeds=$(find raw_data -maxdepth 1 -type f -name '*.xml' -size +0c | wc -l)
          if [ "$valid_feeds" -eq 0 ]; then
            echo "::error::No valid regional XMLTV feeds were downloaded; refusing to build an empty database."
            exit 1
          fi

          python scripts/build_db.py public/d.sqlite3
          python scripts/validate_db.py public/d.sqlite3

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
